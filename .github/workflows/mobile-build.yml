name: mobile-build

# Manual + tag-driven EAS builds. Triggered by:
#   - `workflow_dispatch` for ad-hoc preview/paper builds from any branch
#   - `mobile-v*` tag push for production submissions to App Store / Play

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (see mobile/app/eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - paper
          - production
      platform:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: 'eas submit after build (TestFlight / Play Internal)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'mobile-v*'
    branches:
      - main

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight EAS build mid-flight

defaults:
  run:
    working-directory: mobile/app

jobs:
  build:
    # Native builds are for tags and manual runs only — a main push ships OTA.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Resolve profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build
        run: |
          eas build \
            --platform ${{ inputs.platform || 'all' }} \
            --profile ${{ steps.profile.outputs.value }} \
            --non-interactive \
            --no-wait

      - name: EAS Submit
        if: ${{ inputs.submit == true || github.event_name == 'push' }}
        run: |
          eas submit \
            --platform ${{ inputs.platform || 'all' }} \
            --profile ${{ steps.profile.outputs.value }} \
            --non-interactive \
            --latest

  ota-update:
    # JS-only changes: ship instantly via EAS Update on every main push
    # (skipped on tag pushes — those go through full build instead).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level: a step's own `if` cannot read env defined on that step.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A backend-only push must not spend an EAS publish on an identical
      # bundle. Done here rather than with a `paths:` trigger filter, which
      # would also apply to the mobile-v* tag pushes the build job needs.
      - name: Did the app change?
        id: changed
        run: |
          if git diff --quiet HEAD^ HEAD -- mobile/app; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.app == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json

      # The action fails outright on an empty token, so it is gated too.
      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.app == 'true' && env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.changed.outputs.app == 'true'
        run: npm ci
        working-directory: mobile/app
      # Gate on the secret rather than swallowing the failure: without
      # EXPO_TOKEN the step is skipped visibly, and with it a failed publish
      # fails the run instead of reporting green while shipping nothing.
      - name: Typecheck and test before publishing
        if: steps.changed.outputs.app == 'true'
        run: |
          npx tsc --noEmit -p .
          npm test
        working-directory: mobile/app

      - name: EAS Update
        if: steps.changed.outputs.app == 'true' && env.EXPO_TOKEN != ''
        run: eas update --branch preview --auto --non-interactive
        working-directory: mobile/app

      - name: No Expo token
        if: steps.changed.outputs.app == 'true' && env.EXPO_TOKEN == ''
        run: |
          echo "::warning::EXPO_TOKEN is not set — OTA not published."
          echo "Add it with: gh secret set EXPO_TOKEN -R canberkaslan/trading"
