name: agent-ci

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'

defaults:
  run:
    working-directory: agent

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --extra dev

      # Ordered so the suite runs first. Ruff has failed on every push this
      # workflow has ever had, which meant the steps after it never ran once —
      # 420 tests that gate nothing, and an image build that has never been
      # attempted. A gate that has never been green is not a gate; it is a red
      # square people learn to scroll past.
      - name: Pytest
        run: uv run pytest --cov=tradingagents_us --cov-report=term

      - name: Mypy
        run: uv run mypy tradingagents_us api
        continue-on-error: true  # Strict mode — relax until phase 4

      # A real gate as of 2026-08-27: the ~340 findings this inherited are at
      # zero. Most were mechanical (164 autofixes, 64 line wraps); the rest
      # were rules that did not fit the design and are now waived by name with
      # the reason in pyproject.toml, rather than left as noise. The three
      # over-complex functions keep their finding scoped per-file — they need a
      # supervised refactor, not a lint edit.
      - name: Ruff
        run: uv run ruff check .

  build-image:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push — wire ECR push in phase 4)
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
          tags: ai-trader-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
