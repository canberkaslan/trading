name: watchdog

# Liveness for the trading box, evaluated somewhere the box cannot influence.
#
# Every other alert this project has runs on the Hetzner host, so when the host
# died on 2026-08-24 nothing fired. GitHub's scheduler has no dependency on that
# machine, which is the only property that matters here.
#
# Scheduled runs are best-effort on GitHub's side and can be delayed under load.
# That was written as a caveat; measured over the 2026-08-25..28 outage it is the
# dominant behavior. Across 46 scheduled runs the median gap was 55 minutes, a
# third of gaps exceeded an hour, and the last three were 10.6h, 9.7h and 8.4h.
# So the cadence is not 30 minutes, and an incident's verdict can be however many
# hours stale — worth knowing before reading one as current.
#
# The offset below is a mitigation, not a diagnosis: '*/30' fires at :00 and :30,
# the minutes every other cron on the platform also asks for, and GitHub drops
# scheduled runs it cannot place. Moving off that boundary is cheap and costs
# nothing if congestion turns out not to be the whole story. It is NOT a fix for
# multi-hour gaps, and the real repair is the watchdog reporting the age of its
# own last check so a stale verdict cannot read as a fresh one.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the verdict without opening or closing an incident'
        type: boolean
        default: false

# Only what filing an incident needs. The watchdog reads no code beyond its own
# checkout and must never be a path to anything else in the repo.
permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No `uv sync`, no dependencies: the watchdog is stdlib-only so that a
      # broken lockfile or a registry outage cannot take the last working
      # alerting path down with it.
      - name: Probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The backup repo is private and in another repository, which the
          # built-in token cannot read. Without this secret the watchdog still
          # works, but on one signal: it can report "unreachable" and never
          # distinguish a dead tunnel from a dead host. Create a fine-grained
          # PAT with Contents:read on canberkaslan/trading-backups.
          WATCHDOG_BACKUP_TOKEN: ${{ secrets.WATCHDOG_BACKUP_TOKEN }}
          # The other way out of "cannot tell": a direct TCP connect to the
          # origin, which needs no credential and can prove the host is up on
          # its own. `host` or `host:port` (default 22), comma-separated for
          # several. It is a *secret* rather than a literal here on purpose —
          # this repo and the issues this workflow files are public, and the
          # origin IP behind Cloudflare is precisely what the proxy is hiding.
          WATCHDOG_HOST: ${{ secrets.WATCHDOG_HOST }}
          WATCHDOG_HEALTH_URL: https://trader.fusapp.com/healthz
          WATCHDOG_BACKUP_REPO: canberkaslan/trading-backups
        run: |
          python agent/scripts/watchdog.py ${{ inputs.dry_run && '--dry-run' || '' }}
