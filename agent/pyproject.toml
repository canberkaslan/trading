[project]
name = "tradingagents-us"
version = "0.1.0"
description = "AI-powered multi-agent trading system for US equities"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Canberk Aslan" }]
dependencies = [
    # LLM & orchestration
    "anthropic>=0.40.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-jose[cryptography]>=3.3.0",  # Cognito JWT validation

    # Data sources (US only — see ADR-008)
    "httpx>=0.27.0",                # Polygon / SEC EDGAR / FRED / Alpaca clients
    "yfinance>=0.2.50",             # fallback OHLCV
    "praw>=7.8.0",                  # Reddit sentiment (Phase 3+)
    "lxml>=5.0.0",                  # Wikipedia S&P 500 history parsing
    "beautifulsoup4>=4.12.0",

    # Analysis & backtest
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=17.0.0",             # parquet
    "vectorbt>=0.27.0",
    "stockstats>=0.6.0",

    # Storage
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",     # Aurora PostgreSQL (sqlite needs no driver)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Pinned to a minor range now that Ruff is a hard CI gate: an unbounded
    # linter turns someone else's release into a red main branch on a morning
    # nobody touched the code. Bump deliberately, with the findings read.
    "ruff>=0.16.4,<0.17",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradingagents_us", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Upstream TradingAgents, vendored rather than authored here. Its style is not
# ours to hold an opinion about, and reformatting it would make every future
# rebase against upstream a merge conflict. It was 561 of the 898 findings that
# kept this repo's lint step red — noise loud enough to hide our own 337.
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "RET", "SIM", "PL"]
ignore = [
    "PLR0913",
    "PLR2004",
    # import-outside-top-level. 123 findings, and reviewing them found no debt:
    # they are optional dependencies imported where their absence is *handled*
    # (`jose` in api/deps.py fails closed, `boto3` only on the S3 backup path),
    # and heavy imports deferred in scripts that must stay startup-cheap. The
    # watchdog is the sharpest case — it is stdlib-only on purpose so that a
    # broken lockfile cannot take the last alerting path down with it, and this
    # rule would push its imports somewhere that breaks that property. A rule
    # that is wrong for the design belongs in this list, not in a backlog.
    "PLC0415",
    # too-many-positional-arguments, the positional-only sibling of PLR0913,
    # which this list already waives. Enforcing one while waiving the other
    # says nothing coherent about the code; the eight hits are risk/execution
    # constructors whose argument lists are the domain's, not an accident.
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Three functions are genuinely over the complexity thresholds, and that is
# real information — but it is an argument for a supervised refactor, not
# something to fix as a lint chore. `submit_order` in particular is the live
# execution path, where a restructuring done to satisfy a linter is exactly
# the kind of change this project makes under a paper drill, never in passing.
# Scoped to these files so the rules keep firing on everything new.
"scripts/trade.py" = ["PLR0912", "PLR0915"]
"scripts/backup.py" = ["PLR0912"]
"tradingagents_us/execution/executor.py" = ["PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)` in a parameter default is not the mutable-default
# bug B008 exists to catch — it is how FastAPI declares dependencies, and the
# alternative the rule suggests would mean hand-rolling injection in every
# route. Ruff ships this setting precisely for callables that are safe there.
# The config objects below are all `@dataclass(frozen=True)`, so the shared-
# instance hazard B008 is named after cannot occur: no caller can mutate the
# default out from under the next one.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "tradingagents_us.execution.executor.ExecutionConfig",
    "tradingagents_us.risk.portfolio_limits.PortfolioLimits",
    "tradingagents_us.backtest.engine.BacktestConfig",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
